<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord — Bibliothèque de quartier</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body data-page="dashboard">
  <div class="app">
    <div id="sidebar-placeholder"></div>

    <main class="main">
      <div class="page-header">
        <div>
          <h1>Tableau de bord</h1>
          <p>Vue d'ensemble de l'activité de la bibliothèque.</p>
        </div>
      </div>

      <div id="alert-zone"></div>

      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <span class="value">—</span>
          <span class="label">Chargement…</span>
        </div>
      </div>

      <div class="table-wrap" id="highlights-wrap" hidden>
        <table>
          <thead>
            <tr>
              <th>Distinction</th>
              <th>Détail</th>
            </tr>
          </thead>
          <tbody id="highlights-tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/nav.js?v=2"></script>
  <script src="js/toast.js"></script>
  <script src="js/dashboard.js?v=2"></script>
</body>
</html>
