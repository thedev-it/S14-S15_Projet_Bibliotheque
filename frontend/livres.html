<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Livres — Bibliothèque de quartier</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body data-page="livres">
  <div class="app">
    <div id="sidebar-placeholder"></div>

    <main class="main">
      <div class="page-header">
        <div>
          <h1>Livres</h1>
          <p>Consulter, rechercher, ajouter, modifier ou supprimer un livre.</p>
        </div>
      </div>

      <div id="alert-zone"></div>

      <section class="form-panel">
        <h2 id="form-title">Ajouter un livre</h2>
        <form id="livre-form">
          <input type="hidden" id="livre-id" value="" />
          <div class="field">
            <label for="titre">Titre</label>
            <input type="text" id="titre" required />
          </div>
          <div class="field">
            <label for="annee_publication">Année de publication</label>
            <input type="number" id="annee_publication" min="0" max="2100" />
          </div>
          <div class="field">
            <label for="auteur_id">Auteur</label>
            <select id="auteur_id" required>
              <option value="">— Sélectionner un auteur —</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn" id="submit-btn">Ajouter</button>
            <button type="button" class="btn secondary" id="cancel-edit-btn" hidden>Annuler</button>
          </div>
        </form>
      </section>

      <div class="toolbar">
        <input type="search" id="search-input" placeholder="Rechercher par titre ou auteur…" />
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Titre</th>
              <th>Auteur</th>
              <th>Année</th>
              <th>Statut</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="livres-tbody">
            <tr><td colspan="5" class="empty-state">Chargement…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </main>
  </div>

  <!-- Inclure avant les balises script dans livres.html -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>Confirmation</h3>
      <p id="confirm-message">Êtes-vous sûr de vouloir effectuer cette action ?</p>
      <div class="modal-actions">
        <button id="confirm-btn-cancel" class="btn secondary small">Annuler</button>
        <button id="confirm-btn-danger" class="btn small">Confirmer</button>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=2"></script>
  <script src="js/nav.js?v=2"></script>
  <script src="js/toast.js"></script>
  <script src="js/livres.js?v=2"></script>
</body>
</html>

  <script src="js/api.js?v=2"></script>
  <script src="js/nav.js?v=2"></script>
  <script src="js/toast.js"></script>
  <script src="js/livres.js?v=2"></script>
</body>
</html>
